{% extends 'base.html' %}

{% block header %}
  <h1>{% block title %}Contrat{% endblock %}</h1>
  {% if g.user %}
    <a class="action" href="{{ url_for('contract.upload') }}">Importer</a>
  {% endif %}
{% endblock %}

{% block content %}
  {% for contract in contracts %}
    <article class="contract">
      <p class="body">{{ contract['nb_kids'] }}</p>
    </article>
    {% if not loop.last %}
      <hr>
    {% endif %}
  {% endfor %}
{% endblock %}
